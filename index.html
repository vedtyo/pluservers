<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plutonium Servers - Live Game Server Browser</title>
    <meta name="description" content="Browse live Plutonium game servers for Black Ops II, Modern Warfare 3, World at War and Black Ops. View players, maps, game modes and server information.">
    <meta name="robots" content="index, follow">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="128x128" href="favicon.png?v=2">
    <link rel="shortcut icon" type="image/png" href="favicon.png?v=2">
    <link rel="apple-touch-icon" sizes="128x128" href="favicon.png?v=2">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-446Y45EWPD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-446Y45EWPD');
    </script>

    <style>
        :root {
            --bg: #0b0d10;
            --surface: #12151b;
            --surface-2: #181c24;
            --surface-hover: #1e232e;
            --border: #282f3a;
            --border-soft: #1f2530;
            --text: #f0f2f5;
            --muted: #8e96a3;
            --muted-2: #656d78;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-soft: rgba(59, 130, 246, 0.12);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            --radius: 8px;
            --radius-lg: 12px;
            --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body.light-mode {
            --bg: #f4f6f9;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --surface-hover: #f1f5f9;
            --border: #dbe0e6;
            --border-soft: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
            --muted-2: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft: rgba(37, 99, 235, 0.08);
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            transition: background-color 0.2s ease, color 0.2s ease;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Header / Top Bar */
        #top-bar {
            position: sticky;
            top: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(11, 13, 16, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin: -20px -20px 20px -20px;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: background 0.2s ease;
        }

        body.light-mode #top-bar {
            background: rgba(244, 246, 249, 0.88);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text) 30%, var(--muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 9px;
            height: 9px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        #status {
            font-size: 13px;
            color: var(--muted);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-badge {
            background: var(--surface-2);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-weight: 600;
            color: var(--text);
        }

        #top-bar-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-button {
            width: 38px;
            height: 38px;
            padding: 0;
            cursor: pointer;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            font-size: 16px;
        }

        .icon-button:hover {
            background: var(--surface-hover);
            border-color: var(--muted-2);
            transform: translateY(-1px);
        }

        .icon-button:active {
            transform: translateY(0);
        }

        .refresh-icon {
            display: inline-block;
            transition: transform 0.5s ease;
        }

        .refresh-button.is-loading .refresh-icon {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Stats Header Banner */
        .stats-banner {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: var(--shadow);
            transition: border-color 0.2s ease;
        }

        .stat-card:hover {
            border-color: var(--muted-2);
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            font-weight: 600;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
        }

        /* Game Tabs */
        .game-buttons {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 20px;
            scrollbar-width: thin;
        }

        .game-button {
            padding: 10px 16px;
            font-size: 13px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
            transition: all 0.15s ease;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .game-button strong {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .game-button small {
            font-size: 11px;
            color: var(--muted);
        }

        .game-button:hover {
            background: var(--surface-hover);
            border-color: var(--muted-2);
        }

        .game-button.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-soft);
        }

        .game-button.active strong {
            color: var(--accent);
        }

        /* Search & Filters */
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1 1 300px;
        }

        .search-container input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
            font-size: 14px;
        }

        .search-container input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .btn {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--surface-hover);
            border-color: var(--muted-2);
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .filter-chip {
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .filter-chip.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        /* Server Table Container */
        #servers {
            position: relative;
            min-height: 200px;
        }

        .game-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .game-title {
            padding: 16px 20px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .game-title-meta {
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 720px;
            table-layout: fixed;
        }

        th {
            background: var(--surface-2);
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        th:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        th.active-sort {
            color: var(--accent);
        }

        th.country-column { width: 8%; text-align: center; }
        th.server-column { width: 38%; }
        th.players-column { width: 12%; text-align: left; }
        th.game-column { width: 12%; }
        th.map-column { width: 18%; }
        th.mode-column { width: 12%; }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-soft);
            font-size: 14px;
            vertical-align: middle;
        }

        tr.server-row {
            cursor: pointer;
            transition: background-color 0.12s ease;
        }

        tr.server-row:hover {
            background: var(--surface-hover);
        }

        .country {
            text-align: center;
        }

        .country-flag {
            width: 28px;
            height: 20px;
            border-radius: 3px;
            object-fit: cover;
            vertical-align: middle;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .server-name {
            font-weight: 600;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .expand-arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 8px;
            color: var(--muted);
            font-size: 12px;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .expand-arrow.open {
            transform: rotate(180deg);
            color: var(--accent);
        }

        .player-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 68px;
            padding: 4px 10px;
            border: 1px solid;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        .player-empty {
            color: var(--muted);
            border-color: rgba(142, 150, 163, 0.25);
            background: rgba(142, 150, 163, 0.05);
        }

        .player-low {
            color: #eab308;
            border-color: rgba(234, 179, 8, 0.35);
            background: rgba(234, 179, 8, 0.08);
        }

        .player-medium {
            color: #22c55e;
            border-color: rgba(34, 197, 94, 0.35);
            background: rgba(34, 197, 94, 0.08);
        }

        .player-full {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.35);
            background: rgba(239, 68, 68, 0.08);
        }

        .game-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }

        .map-cell, .mode-cell {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
        }

        /* Expanded Details Row */
        .details-row {
            background: var(--surface-2);
        }

        .details-card {
            padding: 16px 20px;
            border-left: 4px solid var(--accent);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            font-weight: 700;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-all;
        }

        .copy-btn {
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            color: var(--accent);
        }

        .copy-btn.copied {
            background: rgba(34, 197, 94, 0.15);
            border-color: #22c55e;
            color: #22c55e;
        }

        .code-box {
            background: var(--bg);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-family: monospace;
            font-size: 13px;
            color: #38bdf8;
            word-break: break-all;
        }

        .no-results {
            padding: 40px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            color: var(--muted);
            font-size: 15px;
        }

        .servers-loading {
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--muted);
            font-size: 14px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            #top-bar { margin: -12px -12px 16px -12px; padding: 10px 14px; }
            .brand-title { font-size: 18px; }
            .stats-banner { grid-template-columns: 1fr 1fr; }
            .stat-value { font-size: 18px; }
            th.country-column { width: 12%; }
            th.server-column { width: 48%; }
            th.players-column { width: 20%; }
            th.game-column, th.map-column, th.mode-column { display: none; }
            td.game-name, td.map-cell, td.mode-cell { display: none; }
        }
    </style>
</head>
<body class="dark-mode">

<div class="container">

    <!-- Sticky Header -->
    <header id="top-bar">
        <div class="brand-container">
            <div>
                <h1 class="brand-title">
                    <span class="live-dot" title="Live Server Feed"></span>
                    Plutonium Servers
                </h1>
                <p id="status">
                    <span>Loading live server list...</span>
                </p>
            </div>
        </div>

        <div id="top-bar-buttons">
            <button onclick="openStatusPage()" class="icon-button" title="Plutonium Status" aria-label="Plutonium Status">
                ⚡
            </button>
            <button onclick="toggleDarkMode()" id="darkModeButton" class="icon-button" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
                ☀️
            </button>
            <button onclick="loadServers()" class="icon-button refresh-button" id="refreshButton" title="Refresh Servers" aria-label="Refresh Servers">
                <span class="refresh-icon">↻</span>
            </button>
            <button onclick="window.scrollTo({top:0,behavior:'smooth'})" class="icon-button" title="Scroll to Top" aria-label="Scroll to Top">
                ↑
            </button>
        </div>
    </header>

    <!-- Overall Statistics Header -->
    <section class="stats-banner" id="statsBanner">
        <div class="stat-card">
            <span class="stat-label">Total Servers</span>
            <span class="stat-value" id="statTotalServers">—</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Players Online</span>
            <span class="stat-value" id="statTotalPlayers">—</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Most Active Game</span>
            <span class="stat-value" id="statTopGame">—</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Last Updated</span>
            <span class="stat-value" id="statLastUpdated" style="font-size: 16px;">—</span>
        </div>
    </section>

    <!-- Game Selector Tabs -->
    <nav id="gameButtons" class="game-buttons" aria-label="Game Filter Tabs">
        <!-- Rendered dynamically -->
    </nav>

    <!-- Search & Filters -->
    <section class="search-container">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search server name, map, mode, country..." oninput="handleSearchInput(event)" onkeydown="handleSearchKey(event)">
        </div>

        <button onclick="searchServers()" class="btn btn-primary">Search</button>
        <button onclick="clearSearch()" class="btn">Clear</button>

        <div class="filter-chip" id="filterHasPlayers" onclick="toggleFilterHasPlayers()">
            🔥 Has Players
        </div>
        <div class="filter-chip" id="filterZombies" onclick="toggleFilterZombies()">
            🧟 Zombies Only
        </div>
    </section>

    <!-- Server List Container -->
    <main id="servers">
        <div class="servers-loading">
            <div class="spinner"></div>
            <span>Fetching live Plutonium server feeds...</span>
        </div>
    </main>

</div>

<script>

const API_URLS = [
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=T6&limit=500",
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=T6ZM&limit=500",
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=IW5&limit=500",
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=T4&limit=500",
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=T4ZM&limit=500",
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=T5&limit=500",
    "https://gameserve.rs/api/v1/servers?platform=plutonium&game=T5ZM&limit=500"
];

const GAME_NAMES = {
    "T6": "BO2 MP",
    "T6ZM": "BO2 ZM",
    "IW5": "MW3 MP",
    "T5": "BO1 MP",
    "T5ZM": "BO1 ZM",
    "T4": "WaW MP",
    "T4ZM": "WaW ZM"
};

const GAME_FULL_NAMES = {
    "T6": "Black Ops II",
    "T6ZM": "Black Ops II Zombies",
    "IW5": "Modern Warfare 3",
    "T5": "Black Ops",
    "T5ZM": "Black Ops Zombies",
    "T4": "World at War",
    "T4ZM": "World at War Zombies"
};

const GAME_PATHS = {
    "T6": "/BO2-MP",
    "T6ZM": "/BO2-ZM",
    "IW5": "/MW3-MP",
    "T5": "/BO1-MP",
    "T5ZM": "/BO1-ZM",
    "T4": "/WaW-MP",
    "T4ZM": "/WaW-ZM"
};

let allServers = [];
let currentSort = "players";
let sortDescending = true;
let expandedServerId = null;
let selectedGame = "ALL";
let searchQuery = "";
let filterHasPlayersOnly = false;
let filterZombiesOnly = false;
let activeLoadRequest = 0;
let lastUpdatedTime = null;
let debounceTimer = null;

/* Initial load configuration */
window.addEventListener("DOMContentLoaded", () => {
    initDarkMode();
    readUrlParameters();
    loadServers();
    setInterval(loadServers, 30000);
});

function readUrlParameters() {
    const urlParams = new URLSearchParams(window.location.search);
    searchQuery = (urlParams.get("q") || "").trim().toLowerCase();
    const input = document.getElementById("searchInput");
    if (input) input.value = searchQuery;
    selectedGame = getGameFromCurrentUrl();
}

function openStatusPage() {
    window.open("https://status.plutonium.pw/", "_blank");
}

/* API Fetching */
async function loadServers() {
    const requestId = ++activeLoadRequest;
    startRefreshAnimation();

    const serversContainer = document.getElementById("servers");
    if (allServers.length === 0 && serversContainer) {
        serversContainer.innerHTML = `
            <div class="servers-loading">
                <div class="spinner"></div>
                <span>Fetching live Plutonium server feeds...</span>
            </div>
        `;
    }

    try {
        const responseResults = await Promise.allSettled(
            API_URLS.map(url => fetch(url))
        );

        const responses = responseResults
            .filter(res => res.status === "fulfilled" && res.value.ok)
            .map(res => res.value);

        if (!responses.length) {
            throw new Error("No server feeds were available");
        }

        const results = await Promise.all(responses.map(res => res.json()));

        if (requestId !== activeLoadRequest) return;

        let fetchedServers = results.flatMap(result => {
            if (result && result.success && result.data && Array.isArray(result.data.servers)) {
                return result.data.servers.filter(s => s != null);
            }
            return [];
        });

        // Deduplicate servers by unique ID or IP:Port
        const uniqueMap = new Map();
        fetchedServers.forEach(server => {
            const serverId = getServerKey(server);
            if (serverId) {
                uniqueMap.set(serverId, server);
            }
        });

        allServers = Array.from(uniqueMap.values());
        lastUpdatedTime = new Date();

        updateHeaderStats();
        renderGameButtons();
        renderServers();

    } catch (error) {
        if (requestId !== activeLoadRequest) return;
        console.error("Error fetching Plutonium servers:", error);

        const status = document.getElementById("status");
        if (status) {
            status.innerHTML = `<span style="color:#ef4444; font-weight:600;">⚠️ Error loading live server feeds</span>`;
        }

        if (allServers.length === 0 && serversContainer) {
            serversContainer.innerHTML = `
                <div class="no-results">
                    Live server data is temporarily unavailable. Please try refreshing again in a moment.
                </div>
            `;
        }
    } finally {
        if (requestId === activeLoadRequest) {
            stopRefreshAnimation();
        }
    }
}

function getServerKey(server) {
    if (!server) return null;
    return server.id || server.address || (server.ip && server.port ? `${server.ip}:${server.port}` : null);
}

function updateHeaderStats() {
    const totalServers = allServers.length;
    const totalPlayers = allServers.reduce((sum, s) => sum + Number(s?.players?.current || 0), 0);

    // Find top game
    const gamePlayerCounts = {};
    allServers.forEach(s => {
        const gid = s.game?.id || "UNKNOWN";
        gamePlayerCounts[gid] = (gamePlayerCounts[gid] || 0) + Number(s?.players?.current || 0);
    });

    let topGameId = "T6";
    let maxCount = -1;
    Object.entries(gamePlayerCounts).forEach(([gid, count]) => {
        if (count > maxCount) {
            maxCount = count;
            topGameId = gid;
        }
    });

    document.getElementById("statTotalServers").textContent = totalServers.toLocaleString();
    document.getElementById("statTotalPlayers").textContent = totalPlayers.toLocaleString();
    document.getElementById("statTopGame").textContent = getShortGameName(topGameId);

    const timeStr = lastUpdatedTime ? lastUpdatedTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : "Just now";
    document.getElementById("statLastUpdated").textContent = timeStr;

    const statusEl = document.getElementById("status");
    if (statusEl) {
        statusEl.innerHTML = `
            <span><strong class="status-badge">${totalServers}</strong> servers online</span>
            <span>•</span>
            <span><strong class="status-badge">${totalPlayers}</strong> players active</span>
        `;
    }
}

/* Navigation & Game Selection */
function renderGameButtons() {
    const container = document.getElementById("gameButtons");
    if (!container) return;
    container.innerHTML = "";

    const totalPlayers = allServers.reduce((sum, s) => sum + Number(s?.players?.current || 0), 0);

    // ALL Games Button
    const allBtn = document.createElement("button");
    allBtn.className = `game-button ${selectedGame === "ALL" ? "active" : ""}`;
    allBtn.type = "button";
    allBtn.innerHTML = `
        <strong>ALL GAMES</strong>
        <small>${allServers.length} servers · ${totalPlayers} players</small>
    `;
    allBtn.onclick = () => selectGame("ALL");
    container.appendChild(allBtn);

    // Group servers by game ID
    const games = {};
    allServers.forEach(server => {
        const gid = server.game?.id || "UNKNOWN";
        if (!games[gid]) {
            games[gid] = { id: gid, name: server.game?.name || GAME_FULL_NAMES[gid] || gid, servers: [] };
        }
        games[gid].servers.push(server);
    });

    // Render defined order
    const orderedGameIds = ["T6", "T6ZM", "IW5", "T4", "T4ZM", "T5", "T5ZM"];
    orderedGameIds.forEach(gid => {
        const gameData = games[gid] || { id: gid, name: GAME_FULL_NAMES[gid] || gid, servers: [] };
        const playersCount = gameData.servers.reduce((sum, s) => sum + Number(s?.players?.current || 0), 0);

        const btn = document.createElement("button");
        btn.className = `game-button ${selectedGame === gid ? "active" : ""}`;
        btn.type = "button";
        btn.innerHTML = `
            <strong>${escapeHtml(getShortGameName(gid))}</strong>
            <small>${gameData.servers.length} servers · ${playersCount} online</small>
        `;
        btn.onclick = () => selectGame(gid);
        container.appendChild(btn);
    });
}

function selectGame(gameId) {
    selectedGame = gameId || "ALL";
    expandedServerId = null;
    renderGameButtons();
    renderServers();

    const targetPath = GAME_PATHS[selectedGame] || "/";
    if (window.location.protocol === "file:") {
        window.location.hash = selectedGame === "ALL" ? "" : targetPath.slice(1);
    } else if (window.location.pathname !== targetPath) {
        window.history.pushState({ game: selectedGame }, "", targetPath + window.location.search);
    }
}

function getGameFromCurrentUrl() {
    const currentPath = window.location.pathname.replace(/\/+$/, "").toLowerCase() || "/";
    const pathMatch = Object.entries(GAME_PATHS).find(([, p]) => p.toLowerCase() === currentPath);
    if (pathMatch) return pathMatch[0];

    if (window.location.protocol === "file:") {
        const hash = window.location.hash.slice(1);
        const hashMatch = Object.entries(GAME_PATHS).find(([, p]) => p.slice(1).toLowerCase() === hash.toLowerCase());
        if (hashMatch) return hashMatch[0];
    }
    return "ALL";
}

window.addEventListener("popstate", () => {
    selectedGame = getGameFromCurrentUrl();
    expandedServerId = null;
    renderGameButtons();
    renderServers();
});

/* Server Filtering and Rendering */
function renderServers() {
    const container = document.getElementById("servers");
    if (!container) return;
    container.innerHTML = "";

    let filtered = allServers;

    if (selectedGame !== "ALL") {
        filtered = filtered.filter(s => s.game?.id === selectedGame);
    }

    if (filterHasPlayersOnly) {
        filtered = filtered.filter(s => Number(s.players?.current || 0) > 0);
    }

    if (filterZombiesOnly) {
        filtered = filtered.filter(s => s.isZombies || s.game?.id?.includes("ZM") || (s.mode?.raw || "").toLowerCase().includes("zm"));
    }

    if (searchQuery) {
        filtered = filtered.filter(s => {
            if (!s) return false;
            const text = [
                s.name,
                s.map?.display,
                s.map?.raw,
                s.mode?.display,
                s.mode?.raw,
                s.location?.countryName,
                s.location?.countryCode,
                s.game?.name,
                s.game?.id,
                s.ip,
                s.address
            ].filter(Boolean).join(" ").toLowerCase();
            return text.includes(searchQuery);
        });
    }

    if (filtered.length === 0) {
        container.innerHTML = `<div class="no-results">No servers found matching your filter criteria.</div>`;
        return;
    }

    const groupedGames = {};

    if (selectedGame === "ALL") {
        // Group by Game ID for organized list
        filtered.forEach(s => {
            const gid = s.game?.id || "UNKNOWN";
            if (!groupedGames[gid]) {
                groupedGames[gid] = { name: s.game?.name || GAME_FULL_NAMES[gid] || gid, servers: [] };
            }
            groupedGames[gid].servers.push(s);
        });
    } else {
        groupedGames[selectedGame] = {
            name: GAME_FULL_NAMES[selectedGame] || selectedGame,
            servers: filtered
        };
    }

    Object.entries(groupedGames).forEach(([gid, gameData]) => {
        renderGameSection(gid, gameData, container);
    });
}

function renderGameSection(gameId, gameData, container) {
    const section = document.createElement("div");
    section.className = "game-section";

    const totalPlayers = gameData.servers.reduce((sum, s) => sum + Number(s.players?.current || 0), 0);

    const title = document.createElement("div");
    title.className = "game-title";
    title.innerHTML = `
        <span>${escapeHtml(gameData.name)}</span>
        <span class="game-title-meta">${gameData.servers.length} servers · ${totalPlayers} players online</span>
    `;
    section.appendChild(title);

    const tableContainer = document.createElement("div");
    tableContainer.className = "table-container";

    const table = document.createElement("table");
    const sortedServers = [...gameData.servers].sort(sortServers);

    table.innerHTML = `
        <thead>
            <tr>
                <th class="country-column ${currentSort === "country" ? "active-sort" : ""}" onclick="sortBy('country')">
                    Flag ${currentSort === "country" ? (sortDescending ? "▼" : "▲") : ""}
                </th>
                <th class="server-column ${currentSort === "server" ? "active-sort" : ""}" onclick="sortBy('server')">
                    Server Name ${currentSort === "server" ? (sortDescending ? "▼" : "▲") : ""}
                </th>
                <th class="players-column ${currentSort === "players" ? "active-sort" : ""}" onclick="sortBy('players')">
                    Players ${currentSort === "players" ? (sortDescending ? "▼" : "▲") : ""}
                </th>
                <th class="game-column ${currentSort === "game" ? "active-sort" : ""}" onclick="sortBy('game')">
                    Game ${currentSort === "game" ? (sortDescending ? "▼" : "▲") : ""}
                </th>
                <th class="map-column ${currentSort === "map" ? "active-sort" : ""}" onclick="sortBy('map')">
                    Map ${currentSort === "map" ? (sortDescending ? "▼" : "▲") : ""}
                </th>
                <th class="mode-column ${currentSort === "mode" ? "active-sort" : ""}" onclick="sortBy('mode')">
                    Mode ${currentSort === "mode" ? (sortDescending ? "▼" : "▲") : ""}
                </th>
            </tr>
        </thead>
    `;

    const tbody = document.createElement("tbody");

    sortedServers.forEach(server => {
        const serverId = getServerKey(server);
        const currentP = Number(server.players?.current || 0);
        const maxP = Number(server.players?.max || 0);

        let playerClass = "player-empty";
        if (currentP === maxP && maxP > 0) playerClass = "player-full";
        else if (currentP >= 9) playerClass = "player-medium";
        else if (currentP >= 1) playerClass = "player-low";

        let countryCode = server.location?.countryCode || getCountryCode(server.location?.countryName) || "XX";
        let countryName = server.location?.countryName || "Unknown Country";

        if (server.ip === "74.0.5.27") { countryName = "Brazil"; countryCode = "BR"; }
        if (server.ip === "100.92.24.78" || server.ip === "100.92.44.197") { countryName = "United States"; countryCode = "US"; }
        if (server.ip === "100.92.6.225" || server.ip === "100.92.100.197") { countryName = "Italy"; countryCode = "IT"; }

        const isExpanded = expandedServerId === serverId;

        const row = document.createElement("tr");
        row.className = "server-row";
        row.onclick = () => toggleServer(serverId);

        row.innerHTML = `
            <td class="country" title="${escapeHtml(countryName)}">
                ${getCountryFlagHtml(countryCode)}
            </td>
            <td class="server-name">
                <span class="expand-arrow ${isExpanded ? "open" : ""}">▼</span>
                ${escapeHtml(server.name || "Unknown Plutonium Server")}
            </td>
            <td class="players-count">
                <span class="player-box ${playerClass}">${currentP}/${maxP}</span>
            </td>
            <td class="game-name">
                <span class="game-badge">${escapeHtml(getShortGameName(server.game?.id || gameId))}</span>
            </td>
            <td class="map-cell">
                ${escapeHtml(server.map?.display || server.map?.raw || "Unknown")}
            </td>
            <td class="mode-cell">
                ${escapeHtml(server.mode?.display || server.mode?.raw || "Unknown")}
            </td>
        `;

        tbody.appendChild(row);

        if (isExpanded) {
            const detailsRow = createDetailsRow(server);
            tbody.appendChild(detailsRow);
        }
    });

    table.appendChild(tbody);
    tableContainer.appendChild(table);
    section.appendChild(tableContainer);
    container.appendChild(section);
}

function createDetailsRow(server) {
    const row = document.createElement("tr");
    row.className = "details-row";

    const cell = document.createElement("td");
    cell.colSpan = 6;

    const address = server.address || (server.ip && server.port ? `${server.ip}:${server.port}` : "");
    const connectCmd = address ? `connect ${address}` : "";
    const gameName = getShortGameName(server.game?.id || "UNKNOWN");
    const fullGame = GAME_FULL_NAMES[server.game?.id] || server.game?.name || "Plutonium Game";

    cell.innerHTML = `
        <div class="details-card">
            <div class="detail-item">
                <span class="detail-label">Server Name</span>
                <div class="detail-value">
                    <span>${escapeHtml(server.name || "Unknown Server")}</span>

                </div>
            </div>



            <div class="detail-item">
                <span class="detail-label">Game & Mode</span>
                <span class="detail-value">${escapeHtml(fullGame)} (${escapeHtml(server.mode?.display || server.mode?.raw || 'N/A')})</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Current Map</span>
                <span class="detail-value">${escapeHtml(server.map?.display || server.map?.raw || 'N/A')}</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Players & Bots</span>
                <span class="detail-value">${server.players?.current || 0} / ${server.players?.max || 0} (${server.players?.bots || 0} bots)</span>
            </div>


        </div>
    `;

    row.appendChild(cell);
    return row;
}

function toggleServer(serverId) {
    expandedServerId = expandedServerId === serverId ? null : serverId;
    renderServers();
}

function handleCopyBtnClick(event) {
    event.stopPropagation();
    const btn = event.currentTarget;
    const text = btn.getAttribute("data-copy-text") || "";
    if (!text) return;

    const origHtml = btn.innerHTML;

    navigator.clipboard.writeText(text).then(() => {
        btn.innerHTML = "✓ Copied!";
        btn.classList.add("copied");
        setTimeout(() => {
            btn.innerHTML = origHtml;
            btn.classList.remove("copied");
        }, 1500);
    }).catch(() => {
        // Fallback copy
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);

        btn.innerHTML = "✓ Copied!";
        btn.classList.add("copied");
        setTimeout(() => {
            btn.innerHTML = origHtml;
            btn.classList.remove("copied");
        }, 1500);
    });
}

/* Sorting Logic */
function sortBy(column) {
    if (currentSort === column) {
        sortDescending = !sortDescending;
    } else {
        currentSort = column;
        sortDescending = column === "players";
    }
    renderServers();
}

function sortServers(a, b) {
    if (!a || !b) return 0;

    if (currentSort === "country") {
        const cA = (a.location?.countryName || "Unknown").toLowerCase();
        const cB = (b.location?.countryName || "Unknown").toLowerCase();
        const res = cA.localeCompare(cB);
        return sortDescending ? -res : res;
    }

    if (currentSort === "players") {
        const pA = Number(a.players?.current || 0);
        const pB = Number(b.players?.current || 0);
        return sortDescending ? pB - pA : pA - pB;
    }

    if (currentSort === "server") {
        const res = (a.name || "").toLowerCase().localeCompare((b.name || "").toLowerCase());
        return sortDescending ? -res : res;
    }

    if (currentSort === "game") {
        const gA = getShortGameName(a.game?.id || "UNKNOWN").toLowerCase();
        const gB = getShortGameName(b.game?.id || "UNKNOWN").toLowerCase();
        const res = gA.localeCompare(gB);
        return sortDescending ? -res : res;
    }

    if (currentSort === "map") {
        const mA = (a.map?.display || a.map?.raw || "").toLowerCase();
        const mB = (b.map?.display || b.map?.raw || "").toLowerCase();
        const res = mA.localeCompare(mB);
        return sortDescending ? -res : res;
    }

    if (currentSort === "mode") {
        const moA = (a.mode?.display || a.mode?.raw || "").toLowerCase();
        const moB = (b.mode?.display || b.mode?.raw || "").toLowerCase();
        const res = moA.localeCompare(moB);
        return sortDescending ? -res : res;
    }

    return 0;
}

/* Search and Filters */
function handleSearchInput(event) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
        searchServers();
    }, 200);
}

function handleSearchKey(event) {
    if (event.key === "Enter") {
        searchServers();
    }
}

function searchServers() {
    const input = document.getElementById("searchInput");
    searchQuery = (input ? input.value : "").trim().toLowerCase();

    const url = new URL(window.location.href);
    if (searchQuery) {
        url.searchParams.set("q", searchQuery);
    } else {
        url.searchParams.delete("q");
    }
    window.history.replaceState({}, "", url);

    expandedServerId = null;
    renderServers();
}

function clearSearch() {
    const input = document.getElementById("searchInput");
    if (input) input.value = "";
    searchQuery = "";

    const url = new URL(window.location.href);
    url.searchParams.delete("q");
    window.history.replaceState({}, "", url);

    expandedServerId = null;
    renderServers();
}

function toggleFilterHasPlayers() {
    filterHasPlayersOnly = !filterHasPlayersOnly;
    const chip = document.getElementById("filterHasPlayers");
    if (chip) chip.classList.toggle("active", filterHasPlayersOnly);
    renderServers();
}

function toggleFilterZombies() {
    filterZombiesOnly = !filterZombiesOnly;
    const chip = document.getElementById("filterZombies");
    if (chip) chip.classList.toggle("active", filterZombiesOnly);
    renderServers();
}

/* Utility Helpers */
function getShortGameName(gameId) {
    return GAME_NAMES[gameId] || gameId;
}

function getCountryFlagHtml(countryCode) {
    if (!countryCode || countryCode.length !== 2 || countryCode === "XX") {
        return "🌐";
    }
    const code = countryCode.toLowerCase();
    return `<img src="https://flagcdn.com/w40/${code}.png" alt="${code}" class="country-flag" loading="lazy">`;
}

function getCountryCode(countryName) {
    if (!countryName) return null;
    const map = {
        "argentina": "AR", "brazil": "BR", "brasil": "BR", "united states": "US", "usa": "US",
        "canada": "CA", "mexico": "MX", "chile": "CL", "germany": "DE", "france": "FR",
        "spain": "ES", "italy": "IT", "united kingdom": "GB", "uk": "GB", "netherlands": "NL",
        "poland": "PL", "russia": "RU", "australia": "AU", "japan": "JP", "south korea": "KR"
    };
    return map[String(countryName).trim().toLowerCase()] || null;
}

function startRefreshAnimation() {
    const button = document.getElementById("refreshButton");
    if (button) button.classList.add("is-loading");
}

function stopRefreshAnimation() {
    const button = document.getElementById("refreshButton");
    if (button) button.classList.remove("is-loading");
}

function toggleDarkMode() {
    document.body.classList.toggle("light-mode");
    const isLight = document.body.classList.contains("light-mode");
    localStorage.setItem("themePreference", isLight ? "light" : "dark");

    const btn = document.getElementById("darkModeButton");
    if (btn) btn.textContent = isLight ? "🌙" : "☀️";
}

function initDarkMode() {
    const saved = localStorage.getItem("themePreference");
    if (saved === "light") {
        document.body.classList.add("light-mode");
        const btn = document.getElementById("darkModeButton");
        if (btn) btn.textContent = "🌙";
    }
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = String(text ?? "");
    return div.innerHTML;
}

</script>
